# Wird von Docker Compose automatisch zusätzlich zu docker-compose.yml
# geladen (kein extra Flag nötig). Pinnt hier ausschließlich den echten
# Docker-Volume-Namen auf den historischen Wert von vor der Umbenennung
# reinigungsplan -> clubhub, damit bestehende Installationen (NAS, dieser
# Dev-Rechner) beim Ordner-/Projekt-Umzug ihr bereits befülltes Volume
# weiterverwenden statt ein neues, leeres anzulegen. Bei einer komplett
# frischen Installation ist diese Datei folgenlos (das Volume existiert
# unter diesem Namen einfach noch nicht und wird neu angelegt).
volumes:
  clubhub_data:
    name: reinigungsplan_reinigungsplan_data
