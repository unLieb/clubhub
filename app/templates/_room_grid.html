<!-- Mobile: vertikale Liste, ein Fingertipp pro Bereich -->
<div class="lg:hidden rounded-xl border border-line divide-y divide-line overflow-hidden" id="room-grid-mobile">
  {% for room in rooms %}
  {% set rs = room_status[room.id] %}
  {% include "_room_grid_row_mobile.html" %}
  {% endfor %}
</div>

<!-- Desktop: Karten-Grid -->
<div class="hidden lg:grid gap-3 lg:grid-cols-3 xl:grid-cols-4" id="room-grid-desktop">
  {% for room in rooms %}
  {% set rs = room_status[room.id] %}
  {% include "_room_grid_card_desktop.html" %}
  {% endfor %}
</div>

<div class="hidden lg:flex items-center gap-5 mt-4 pt-3 border-t border-line text-xs text-slate-400">
  <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-go"></span>Erledigt</span>
  <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-warn"></span>Bald fällig</span>
  <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-late"></span>Überfällig</span>
</div>

<script>
  // Asynchrones "Taegliche erledigen" ohne Full-Page-Reload: fetch() statt
  // echtem Formular-POST (Server unterscheidet ueber X-Requested-With: fetch,
  // siehe complete_due_tasks in main.py) - liefert dabei nur die aktualisierte
  // Kachel (mobile Zeile + Desktop-Karte) als HTML-Fragment zurueck, die
  // Seite ersetzt ausschliesslich diese eine Kachel im DOM. Dadurch bleiben
  // Scroll-Position und alles andere auf der Seite unangetastet - anders als
  // beim bisherigen echten POST+Redirect, der ganz oben auf der Seite landete.
  // Event-Delegation auf beide Grid-Container statt Einzel-Bindung pro
  // Formular, damit es nach jedem Kachel-Austausch automatisch weiter
  // funktioniert, ohne neu gebunden werden zu muessen. Klassischer
  // Formular-Fallback (ohne JS) bleibt ueber das normale action/method-
  // Attribut der Formulare erhalten.
  (function () {
    function bindGrid(grid) {
      if (!grid || grid._quickCompleteBound) return;
      grid._quickCompleteBound = true;
      grid.addEventListener('submit', function (e) {
        var form = e.target.closest('.room-quick-complete-form');
        if (!form) return;
        e.preventDefault();
        var tile = form.closest('[id^="room-row-"], [id^="room-card-"]');
        var btn = form.querySelector('button');
        if (btn) btn.disabled = true;
        if (tile) tile.classList.add('opacity-50', 'pointer-events-none');

        fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'X-Requested-With': 'fetch' },
        })
          .then(function (resp) {
            if (!resp.ok) throw new Error('http ' + resp.status);
            return resp.json();
          })
          .then(function (data) {
            var mobileRow = document.getElementById('room-row-' + data.room_id);
            if (mobileRow) mobileRow.outerHTML = data.mobile_html;
            var desktopCard = document.getElementById('room-card-' + data.room_id);
            if (desktopCard) desktopCard.outerHTML = data.desktop_html;
          })
          .catch(function () {
            if (btn) btn.disabled = false;
            if (tile) tile.classList.remove('opacity-50', 'pointer-events-none');
            alert('Abhaken fehlgeschlagen - bitte erneut versuchen.');
          });
      });
    }
    bindGrid(document.getElementById('room-grid-mobile'));
    bindGrid(document.getElementById('room-grid-desktop'));
  })();
</script>
