{% extends "base.html" %}
{% block title %}Anmelden – ClubHUB{% endblock %}
{% block content %}

<div class="max-w-sm mx-auto mt-8">
  <h1 class="font-display text-xl font-semibold mb-5">Anmelden</h1>

  <div id="login-passkey-error" class="hidden rounded-md border border-late/40 bg-late/10 text-late text-sm px-3 py-2 mb-4"></div>
  {% if error %}
  <div class="rounded-md border border-late/40 bg-late/10 text-late text-sm px-3 py-2 mb-4">{{ error }}</div>
  {% endif %}

  <button type="button" id="login-passkey-btn" class="hidden w-full mb-4 py-2.5 rounded-md border border-line bg-panel2 hover:bg-panel text-slate-100 font-medium flex items-center justify-center gap-2">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    Mit Passkey anmelden
  </button>
  <div id="login-passkey-divider" class="hidden flex items-center gap-3 text-xs text-slate-500 mb-4">
    <div class="flex-1 h-px bg-line"></div>oder<div class="flex-1 h-px bg-line"></div>
  </div>

  <form method="post" class="space-y-4">
    <input type="hidden" name="next" value="{{ next or '/' }}">
    <div>
      <label class="block text-sm text-slate-300 mb-1.5">Benutzername oder Personalnummer</label>
      <input type="text" name="identifier" required autofocus autocomplete="username"
             class="w-full rounded-md bg-ink border border-line px-3 py-2 text-slate-100">
    </div>
    <div>
      <label class="block text-sm text-slate-300 mb-1.5">Passwort</label>
      <input type="password" name="password" required autocomplete="current-password"
             class="w-full rounded-md bg-ink border border-line px-3 py-2 text-slate-100">
    </div>
    <button type="submit" class="w-full py-2.5 rounded-md bg-go/90 hover:bg-go text-oncolor font-medium">
      Anmelden
    </button>
  </form>
</div>

<script>
  (function () {
    if (typeof webauthnSupported !== 'function' || !webauthnSupported()) return;
    var btn = document.getElementById('login-passkey-btn');
    var divider = document.getElementById('login-passkey-divider');
    var errorBox = document.getElementById('login-passkey-error');
    btn.classList.remove('hidden');
    divider.classList.remove('hidden');
    btn.addEventListener('click', function () {
      errorBox.classList.add('hidden');
      btn.disabled = true;
      webauthnLoginWithPasskey({{ (next or '/')|tojson }}, function (result) {
        btn.disabled = false;
        if (result.ok) {
          window.location.href = result.redirect || '/';
        } else {
          errorBox.textContent = result.error || 'Passkey-Anmeldung fehlgeschlagen.';
          errorBox.classList.remove('hidden');
        }
      });
    });
  })();
</script>

{% endblock %}
